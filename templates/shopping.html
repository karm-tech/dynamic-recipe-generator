<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping List - DRG 4.0</title>
  <link rel="stylesheet" href="/static/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') no-repeat center center fixed;
      background-size: cover;
    }

    .shopping-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      padding: 10px 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .shopping-item.checked {
      opacity: 0.6;
      text-decoration: line-through;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>

<body>

  <nav>
    <ul>
      <li><a href="/">🏠 Home</a></li>
      <li><a href="/search">🍽 Recipes</a></li>
      <li><a href="/seasonal">🎉 Seasonal</a></li>
      <li><a href="/accessories">🛍 Accessories</a></li>
      <li><a href="/shopping">🛒 Shopping</a></li>
    </ul>
  </nav>

  <div class="container">
    <h2 id="recipeTitleDisplay">Your Shopping List 🛒</h2>

    <div style="text-align: right; margin-bottom: 20px;">
      <button onclick="clearList()"
        style="background: #f44336; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">🗑️
        Clear List</button>
    </div>

    <div id="shoppingList"></div>

    <button class="btn-primary" onclick="window.location.href='/search'" style="margin-top: 20px;">🔙 Find More
      Recipes</button>
  </div>

    <footer>
    <p>Made with ❤️ by <strong>ALPHA SQUAD</strong> | DRG 5.0 Project</p>
    <div class="footer-links">
      <a href="/about">About Us</a> | <a href="/contact">Contact</a>
    </div>
    <p class="copyright">© 2025 Dynamic Recipe Generator. All rights reserved.</p>
  </footer>

</body>

</html>
